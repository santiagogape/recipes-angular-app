<ion-grid>
  <ion-row class="tag-row" id="categories">
    @for (tag of tags().categories; track tag) {
      <ion-col size="auto">
        <ion-chip color="success">
          <ion-label>{{ tag }}</ion-label>
        </ion-chip>
      </ion-col>
    }
  </ion-row>
  <ion-row class="tag-row" id="allergens">
    @for (tag of tags().allergens; track tag) {
      <ion-col size="auto">
        <ion-chip color="warning">
          <ion-label>{{ tag }}</ion-label>
        </ion-chip>
      </ion-col>
    }
  </ion-row>
</ion-grid>
